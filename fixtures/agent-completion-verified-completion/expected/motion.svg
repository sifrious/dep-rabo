<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="rabo-title rabo-desc">
  <title id="rabo-title">Agent completion is not verified completion</title>
  <desc id="rabo-desc">Fifteen seconds in five beats: a completion claim is reframed as a claim, checked, evidenced, and only then called verified. A five step chain reading: the agent reports &quot;Done&quot;; that report is a claim; independent checks run; evidence appears; only then is completion verified. The agent reports &quot;Done&quot;. That report is a claim, not a result. Independent checks run, by something that is not the author. Evidence appears: commit SHA, exit code, artifact digest. Only now is completion verified.</desc>

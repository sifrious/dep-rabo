name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor composer.json declares, so it is proven rather than assumed.
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # install, not update: this package ships a committed lock and the whole point is
      # that a checkout reproduces byte-identical artifacts.
      - run: composer install --no-interaction --prefer-dist --no-progress

      # The runner has neither resvg nor ffmpeg, and that is deliberate. The suite proves
      # the MP4 adapter declares no capability and refuses deterministically without them.
      - run: composer test

      - run: composer audit --locked --no-interaction
